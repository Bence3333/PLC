<circle cx="450.0" cy="160.0" r="6" fill="#ffffff" stroke="#b8282c" stroke-width="2"/><line x1="441.0" y1="160.0" x2="459.0" y2="160.0" stroke="#b8282c" stroke-width="1.5"/><line x1="450.0" y1="151.0" x2="450.0" y2="169.0" stroke="#b8282c" stroke-width="1.5"/>
<text x="464.0" y="165.0" font-size="12.5" fill="#52514e" text-anchor="start">Kiindulas (Z = 150; a rajz síkja mögött, Y = 0)</text>
<text x="20.0" y="605.0" font-size="12.5" fill="#52514e" text-anchor="start">A műszer függőlegesen áll, a hegye a TCP. A zóna fölött a hegy 40 mm-re, a C1 és a C2 fölött leereszkedve 50 mm-re van a zónától.</text>
