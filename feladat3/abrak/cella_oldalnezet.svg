<line x1="274.0" y1="325.0" x2="384.0" y2="325.0" stroke="#1f1e1c" stroke-width="1"/><line x1="274.0" y1="319.0" x2="274.0" y2="331.0" stroke="#1f1e1c" stroke-width="1"/><line x1="384.0" y1="319.0" x2="384.0" y2="331.0" stroke="#1f1e1c" stroke-width="1"/><text x="329.0" y="319.0" font-size="12.5" fill="#1f1e1c" text-anchor="middle">50 mm</text>
