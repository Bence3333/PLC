<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1f1e1c">
<defs><marker id="nyil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="nyilk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="13" fill="#52514e" text-anchor="start">Oldalnézet a C1–C2 vonal mentén (X jobbra, Z felfelé), méretarányos rajz. A műszer hegye (TCP) útja:</text>
<line x1="24.0" y1="52.0" x2="74.0" y2="52.0" stroke="#1c5aa6" stroke-width="2.6"/>
<text x="84.0" y="57.0" font-size="13" fill="#1f1e1c" text-anchor="start">a helyes út: fel a biztonsági magasságra, a zóna fölött át, majd függőlegesen le</text>
<line x1="24" y1="78" x2="74" y2="78" stroke="#b8282c" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="84.0" y="83.0" font-size="13" fill="#1f1e1c" text-anchor="start">a hibás út (Precizios_HIBAS): egyenesen, alacsonyan C1-ből C2-be – átmegy a tiltott zónán</text>
<rect x="120.0" y="491.1" width="660.0" height="44.0" fill="#d7e6f2" stroke="#6f8fa8" stroke-width="1.5"/>
<text x="126.0" y="553.1" font-size="12.5" fill="#6f8fa8" text-anchor="start">Mutoasztal (teteje Z = 0; pontosan -0,5 mm)</text>
<rect x="384.0" y="358.0" width="132.0" height="132.0" fill="#f2b3ad" stroke="#b8282c" stroke-width="2"/>
<text x="450.0" y="424.0" font-size="13" fill="#b8282c" text-anchor="middle" font-weight="bold">Tiltott_zona</text>
<text x="450.0" y="440.0" font-size="11.5" fill="#b8282c" text-anchor="middle">60 mm magas</text>
<line x1="284.0" y1="486.0" x2="616.0" y2="486.0" stroke="#b8282c" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#nyil)"/>
<text x="450.0" y="530.0" font-size="14" fill="#b8282c" text-anchor="middle" font-weight="bold">ütközés!</text>
<line x1="268.0" y1="480.0" x2="268.0" y2="280.0" stroke="#1c5aa6" stroke-width="2.4" marker-end="url(#nyil)"/>
<line x1="284.0" y1="270.0" x2="616.0" y2="270.0" stroke="#1c5aa6" stroke-width="2.6" marker-end="url(#nyil)"/>
