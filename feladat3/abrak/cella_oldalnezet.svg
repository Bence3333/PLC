<text x="260.0" y="258.0" font-size="13" fill="#1f1e1c" text-anchor="end" font-weight="bold">C1_felett (Z = 100)</text>
<text x="640.0" y="258.0" font-size="13" fill="#1f1e1c" text-anchor="start" font-weight="bold">C2_felett (Z = 100)</text>
<text x="260.0" y="480.0" font-size="13" fill="#1f1e1c" text-anchor="end" font-weight="bold">C1 (Z = 0)</text>
<text x="640.0" y="480.0" font-size="13" fill="#1f1e1c" text-anchor="start" font-weight="bold">C2 (Z = 0)</text>
